<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b101e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .mensaje {
            position: absolute;
            top: 5%;
            color: #ff3bad;
            font-size: 2.5rem;
            text-align: center;
            z-index: 2;
            opacity: 0;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
            animation: aparecer 2s forwards;
            animation-delay: 4s;
            pointer-events: none;
        }
        @keyframes aparecer {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mensaje">Para ti Principessa</div>
    <canvas id="lienzo"></canvas>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        
        function ajustarTamaño() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarTamaño);
        ajustarTamaño();

        const flores = [];
        const coloresAmarillos = ['#FFD700', '#FFEA00', '#FDD835', '#FBC02D', '#FFC107', '#FFB300', '#FFF176', '#FFEE58'];

        class Flor {
            constructor(tx, ty, delay) {
                this.tx = tx;
                this.ty = ty;
                this.sx = canvas.width / 2;
                this.sy = canvas.height + 50;
                this.cx = this.sx + (this.tx - this.sx) * 0.5 + (Math.random() * 150 - 75);
                this.cy = this.sy - (this.sy - this.ty) * 0.3;
                this.delay = delay;
                this.progreso = 0;
                this.floracion = 0;
                this.velocidad = 0.025 + Math.random() * 0.02;
                this.color = coloresAmarillos[Math.floor(Math.random() * coloresAmarillos.length)];
                this.radio = 6 + Math.random() * 6;
                this.petalos = 5 + Math.floor(Math.random() * 4);
                this.angBase = Math.random() * Math.PI * 2;
                this.tipo = Math.floor(Math.random() * 5);
            }

            dibujar() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }

                if (this.progreso < 1) {
                    this.progreso += this.velocidad;
                } else if (this.floracion < 1) {
                    this.floracion += 0.08;
                }

                let p = Math.min(this.progreso, 1);
                let x = Math.pow(1-p, 2)*this.sx + 2*(1-p)*p*this.cx + Math.pow(p, 2)*this.tx;
                let y = Math.pow(1-p, 2)*this.sy + 2*(1-p)*p*this.cy + Math.pow(p, 2)*this.ty;

                ctx.beginPath();
                ctx.moveTo(this.sx, this.sy);
                ctx.quadraticCurveTo(this.cx, this.cy, x, y);
                ctx.strokeStyle = '#1b5e20';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                if (this.progreso >= 1) {
                    ctx.save();
                    ctx.translate(this.tx, this.ty);
                    ctx.scale(this.floracion, this.floracion);
                    ctx.rotate(this.angBase);
                    
                    if (this.tipo === 0) {
                        for (let i = 0; i < 18; i++) {
                            ctx.rotate((Math.PI * 2) / 18);
                            ctx.beginPath();
                            ctx.ellipse(0, this.radio * 1.5, this.radio * 0.25, this.radio * 1.5, 0, 0, Math.PI * 2);
                            ctx.fillStyle = '#FFC107';
                            ctx.fill();
                        }
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radio * 0.9, 0, Math.PI * 2);
                        ctx.fillStyle = '#3e2723';
                        ctx.fill();
                    } else if (this.tipo === 1) {
                        for (let i = 0; i < 14; i++) {
                            ctx.rotate((Math.PI * 2) / 14);
                            ctx.beginPath();
                            ctx.ellipse(0, this.radio * 1.3, this.radio * 0.2, this.radio * 1.4, 0, 0, Math.PI * 2);
                            ctx.fillStyle = '#FFF59D';
                            ctx.fill();
                        }
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radio * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFB300';
                        ctx.fill();
                    } else if (this.tipo === 2) {
                        ctx.beginPath();
                        ctx.moveTo(-this.radio * 0.8, -this.radio);
                        ctx.bezierCurveTo(-this.radio, this.radio * 1.5, this.radio, this.radio * 1.5, this.radio * 0.8, -this.radio);
                        ctx.lineTo(this.radio * 0.3, -this.radio * 0.2);
                        ctx.lineTo(0, -this.radio * 1.2);
                        ctx.lineTo(-this.radio * 0.3, -this.radio * 0.2);
                        ctx.closePath();
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.strokeStyle = '#F57F17';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    } else if (this.tipo === 3) {
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radio * 1.2, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.strokeStyle = '#E65100';
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radio * 0.8, 0, Math.PI * 1.5);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(this.radio * 0.2, 0, this.radio * 0.4, 0, Math.PI * 1.8);
                        ctx.stroke();
                    } else {
                        for (let i = 0; i < this.petalos; i++) {
                            ctx.rotate((Math.PI * 2) / this.petalos);
                            ctx.beginPath();
                            ctx.ellipse(0, this.radio, this.radio * 0.5, this.radio * 1.5, 0, 0, Math.PI * 2);
                            ctx.fillStyle = this.color;
                            ctx.fill();
                            ctx.strokeStyle = '#F57F17';
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radio * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = '#4e342e';
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }
        }

        function crearRamo() {
            flores.length = 0;
            const escala = Math.min(canvas.width, canvas.height) * 0.016;
            const cX = canvas.width / 2;
            const cY = canvas.height * 0.45;

            for (let i = 0; i < 200; i++) {
                let t = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random());
                
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                let tx = cX + hx * escala * r;
                let ty = cY + hy * escala * r;
                
                let delay = Math.random() * 60; 
                flores.push(new Flor(tx, ty, delay));
            }
            
            flores.sort((a, b) => a.ty - b.ty);
        }

        crearRamo();

        function animar() {
            ctx.fillStyle = '#0b101e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            flores.forEach(flor => flor.dibujar());
            
            requestAnimationFrame(animar);
        }

        animar();

    </script>
</body>
</html>
