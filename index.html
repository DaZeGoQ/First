<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b101e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .mensaje {
            position: absolute;
            top: 10%;
            color: #ffeb3b;
            font-size: 2.5rem;
            text-align: center;
            z-index: 2;
            opacity: 0;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
            animation: aparecer 2s forwards;
            animation-delay: 6s;
            pointer-events: none;
        }
        @keyframes aparecer {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="mensaje">Para ti 💛</div>
    <canvas id="lienzo"></canvas>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        
        function ajustarTamaño() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarTamaño);
        ajustarTamaño();

        function obtenerPuntoCorazon(t, escala) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * escala, y: y * escala };
        }

        const flores = [];
        const coloresAmarillos = ['#FFD700', '#FFEA00', '#FDD835', '#FBC02D'];

        class Flor {
            constructor(targetX, targetY, delay) {
                this.tx = targetX;
                this.ty = targetY;
                this.sx = canvas.width / 2 + (Math.random() * 20 - 10);
                this.sy = canvas.height + 50;
                
                this.cx = this.sx + (this.tx - this.sx) * (Math.random() * 0.5 + 0.5);
                this.cy = this.sy - (this.sy - this.ty) * 0.3;
                
                this.delay = delay;
                this.progresoTallo = 0;
                this.floracion = 0;
                this.velocidadTallo = 0.015 + Math.random() * 0.01;
                this.color = coloresAmarillos[Math.floor(Math.random() * coloresAmarillos.length)];
                this.cantidadPetalos = 6 + Math.floor(Math.random() * 5);
            }

            dibujar() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }

                if (this.progresoTallo < 1) {
                    this.progresoTallo += this.velocidadTallo;
                } else if (this.floracion < 1) {
                    this.floracion += 0.05; 
                }

                let p = Math.min(this.progresoTallo, 1);
                
                let cpX_new = this.sx + (this.cx - this.sx) * p;
                let cpY_new = this.sy + (this.cy - this.sy) * p;
                let currentX = Math.pow(1-p, 2)*this.sx + 2*(1-p)*p*this.cx + Math.pow(p, 2)*this.tx;
                let currentY = Math.pow(1-p, 2)*this.sy + 2*(1-p)*p*this.cy + Math.pow(p, 2)*this.ty;

                ctx.beginPath();
                ctx.moveTo(this.sx, this.sy);
                ctx.quadraticCurveTo(cpX_new, cpY_new, currentX, currentY);
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 2.5;
                ctx.lineCap = "round";
                ctx.stroke();

                if (this.progresoTallo >= 1) {
                    ctx.save();
                    ctx.translate(this.tx, this.ty);
                    ctx.scale(this.floracion, this.floracion);
                    
                    for (let i = 0; i < this.cantidadPetalos; i++) {
                        ctx.rotate((Math.PI * 2) / this.cantidadPetalos);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(8, -15, 0, -25);
                        ctx.quadraticCurveTo(-8, -15, 0, 0);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.strokeStyle = '#F57F17';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#5D4037';
                    ctx.fill();
                    
                    ctx.restore();
                }
            }
        }

        function inicializarFlores() {
            flores.length = 0;
            const escala = Math.min(canvas.width, canvas.height) * 0.015;
            const centroX = canvas.width / 2;
            const centroY = canvas.height * 0.45;
            let index = 0;

            for (let i = 0; i < 45; i++) {
                let t = (Math.PI * 2 * i) / 45;
                let p = obtenerPuntoCorazon(t, escala);
                flores.push(new Flor(centroX + p.x, centroY + p.y, index * 3));
                index++;
            }

            for (let i = 0; i < 30; i++) {
                let t = (Math.PI * 2 * i) / 30;
                let p = obtenerPuntoCorazon(t, escala * 0.7);
                flores.push(new Flor(centroX + p.x, centroY + p.y, index * 3));
                index++;
            }

            for (let i = 0; i < 15; i++) {
                let t = (Math.PI * 2 * i) / 15;
                let p = obtenerPuntoCorazon(t, escala * 0.4);
                flores.push(new Flor(centroX + p.x, centroY + p.y, index * 3));
                index++;
            }
        }

        inicializarFlores();

        function animar() {
            ctx.fillStyle = '#0b101e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            flores.forEach(flor => flor.dibujar());
            
            requestAnimationFrame(animar);
        }

        animar();

    </script>
</body>
</html>
